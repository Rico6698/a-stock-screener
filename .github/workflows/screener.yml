name: A股选股筛选

on:
  schedule:
    # 早上选股：UTC 22:00 (周日-周四) = CST 06:00 (周一-周五)
    # 时间门控会等至 CST 09:20 再实际运行，每天仅触发一次
    - cron: '0 22 * * 0-4'
    # 下午验证：UTC 08:00 (周一-周五) = CST 16:00，每天仅触发一次
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'screener'
        type: choice
        options:
          - screener
          - validation

permissions:
  contents: write

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 判断模式
        id: mode
        run: |
          python -c "
          SCHEDULE = '${{ github.event.schedule }}'
          EVENT = '${{ github.event_name }}'
          MODE_INPUT = '${{ github.event.inputs.mode }}'
          MORNING = '0 22 * * 0-4'
          AFTERNOON = '0 8 * * 1-5'
          if EVENT == 'workflow_dispatch':
              m = MODE_INPUT or 'screener'
          elif SCHEDULE == MORNING:
              m = 'screener'
          elif SCHEDULE == AFTERNOON:
              m = 'validation'
          else:
              m = 'screener'
          print(f'mode={m}')
          " >> "$GITHUB_OUTPUT"

      # ===== 早上：等待到 9:20 CST 再运行 =====
      - name: 等待至 9:20 CST（时间门控）
        if: steps.mode.outputs.mode == 'screener'
        id: wait
        run: |
          python -c "
          from datetime import datetime, timezone, timedelta
          import time, os, json

          CST = timezone(timedelta(hours=8))
          now = datetime.now(CST)
          target = now.replace(hour=9, minute=20, second=0, microsecond=0)

          # 幂等检查：当天已完成则跳过
          today = now.strftime('%Y-%m-%d')
          already_done = False
          if os.path.exists('results.json'):
              with open('results.json') as f:
                  d = json.load(f)
              if d.get('update_time', '').startswith(today):
                  already_done = True

          if already_done:
              print('今日已完成，跳过')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('skip=true\n')
          elif now < target:
              wait_seconds = (target - now).total_seconds()
              print(f'当前 {now.strftime(\"%H:%M\")} CST，等待 {wait_seconds:.0f} 秒至 9:20...')
              time.sleep(min(wait_seconds, 14400))  # 最多等4小时
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('skip=false\n')
          else:
              print(f'当前 {now.strftime(\"%H:%M\")} CST，已过 9:20，立即运行')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('skip=false\n')
          "

      - name: 运行选股脚本
        if: steps.mode.outputs.mode == 'screener' && steps.wait.outputs.skip != 'true'
        run: |
          python generate_results.py

      - name: 提交结果
        if: steps.mode.outputs.mode == 'screener' && steps.wait.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          git diff --staged --quiet || git commit -m "auto: update screener results $(date -u '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main || true
          git push

      - name: 发送选股邮件
        if: steps.mode.outputs.mode == 'screener' && steps.wait.outputs.skip != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO_ADDR: ${{ secrets.MAIL_TO_ADDR }}
        run: |
          python send_email.py

      - name: 跳过提示
        if: steps.mode.outputs.mode == 'screener' && steps.wait.outputs.skip == 'true'
        run: |
          echo "今日选股已完成，跳过本次运行"

      # ===== 下午：验证模式 =====
      - name: 验证预测结果
        if: steps.mode.outputs.mode == 'validation'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO_ADDR: ${{ secrets.MAIL_TO_ADDR }}
        run: |
          python validate_results.py
