name: A股选股筛选

on:
  schedule:
    # 早上 09:05 CST (01:05 UTC) — 选股推荐（避开整点高峰）
    - cron: '5 1 * * 1-5'
    # 下午 16:05 CST (08:05 UTC) — 结果验证
    - cron: '5 8 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'screener'
        type: choice
        options:
          - screener
          - validation

permissions:
  contents: write

jobs:
  screener:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      # ===== 早上：选股 + 发推荐邮件 =====
      - name: 运行选股脚本
        if: github.event.schedule == '5 1 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'screener')
        run: |
          python generate_results.py

      - name: 提交结果
        if: github.event.schedule == '5 1 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'screener')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          git diff --staged --quiet || git commit -m "auto: update screener results $(date -u '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main || true
          git push

      - name: 发送选股邮件
        if: github.event.schedule == '5 1 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'screener')
        env:
          QQ_MAIL_ADDR: ${{ secrets.QQ_MAIL_ADDR }}
          QQ_MAIL_AUTH: ${{ secrets.QQ_MAIL_AUTH }}
        run: |
          python send_email.py

      # ===== 下午：验证预测结果 + 发对比邮件 =====
      - name: 验证预测结果
        if: github.event.schedule == '5 8 * * 1-5' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'validation')
        env:
          QQ_MAIL_ADDR: ${{ secrets.QQ_MAIL_ADDR }}
          QQ_MAIL_AUTH: ${{ secrets.QQ_MAIL_AUTH }}
        run: |
          python validate_results.py
