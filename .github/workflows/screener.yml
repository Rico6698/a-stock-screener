name: A股选股筛选

on:
  schedule:
    # 尾盘选股兜底：UTC 07:30 (周一-周五) = CST 15:30（收盘后数据完整）
    # 主力靠 cron-job.org 在 CST 14:50 外部触发 workflow_dispatch（准时），此 schedule 仅兜底
    - cron: '30 7 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'screener'
        type: choice
        options:
          - screener
          - validation

permissions:
  contents: write

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 判断模式
        id: mode
        run: |
          MODE_INPUT='${{ github.event.inputs.mode }}'
          EVENT='${{ github.event_name }}'
          if [ "$EVENT" = "workflow_dispatch" ]; then
            m="${MODE_INPUT:-screener}"
          else
            m="screener"
          fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"

      # ===== 尾盘 14:50：先验证昨天推荐，再选今天推荐（T+1 收益验证） =====
      - name: 等待至 14:50 CST（时间门控）
        if: steps.mode.outputs.mode == 'screener'
        id: wait
        run: |
          python -c "
          from datetime import datetime, timezone, timedelta
          import time, os, json

          CST = timezone(timedelta(hours=8))
          now = datetime.now(CST)
          target = now.replace(hour=14, minute=50, second=0, microsecond=0)

          # 幂等检查：当天已选股则跳过（results.json 日期为今天）
          today = now.strftime('%Y-%m-%d')
          already_done = False
          if os.path.exists('results.json'):
              with open('results.json') as f:
                  d = json.load(f)
              if d.get('update_time', '').startswith(today):
                  already_done = True

          if already_done:
              print('今日已选股，跳过')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('skip=true\n')
          elif now < target:
              wait_seconds = (target - now).total_seconds()
              print(f'当前 {now.strftime(\"%H:%M\")} CST，等待 {wait_seconds:.0f} 秒至 14:50...')
              time.sleep(min(wait_seconds, 14400))
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('skip=false\n')
          else:
              print(f'当前 {now.strftime(\"%H:%M\")} CST，已过 14:50，立即运行')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('skip=false\n')
          "

      # ---- 第一步：验证昨天推荐（此时 results.json 还是昨天的） ----
      - name: 验证昨日推荐（T+1 收益）
        if: steps.mode.outputs.mode == 'screener' && steps.wait.outputs.skip != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO_ADDR: ${{ secrets.MAIL_TO_ADDR }}
        run: |
          python validate_results.py || echo "验证步骤异常（不阻断选股）"

      # ---- 第二步：选出今天推荐（覆盖 results.json） ----
      - name: 运行选股脚本
        if: steps.mode.outputs.mode == 'screener' && steps.wait.outputs.skip != 'true'
        run: |
          python generate_results.py

      - name: 提交结果
        if: steps.mode.outputs.mode == 'screener' && steps.wait.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          git diff --staged --quiet || git commit -m "auto: update screener results $(date -u '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main || true
          git push

      - name: 发送选股邮件
        if: steps.mode.outputs.mode == 'screener' && steps.wait.outputs.skip != 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO_ADDR: ${{ secrets.MAIL_TO_ADDR }}
        run: |
          python send_email.py

      - name: 跳过提示
        if: steps.mode.outputs.mode == 'screener' && steps.wait.outputs.skip == 'true'
        run: |
          echo "今日选股已完成，跳过本次运行"

      # ===== 单独验证模式（手动测试用） =====
      - name: 验证预测结果
        if: steps.mode.outputs.mode == 'validation'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO_ADDR: ${{ secrets.MAIL_TO_ADDR }}
        run: |
          python validate_results.py
