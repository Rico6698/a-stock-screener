name: A股选股筛选

on:
  schedule:
    # ===== 早上：选股模式，多重触发确保覆盖延迟 =====
    # CST 04:00 = UTC 20:00 (前一天)
    - cron: '0 20 * * 0-4'
    # CST 05:00 = UTC 21:00 (前一天)
    - cron: '0 21 * * 0-4'
    # CST 06:00 = UTC 22:00 (前一天)
    - cron: '0 22 * * 0-4'
    # CST 07:00 = UTC 23:00 (前一天)
    - cron: '0 23 * * 0-4'
    # CST 08:00 = UTC 00:00
    - cron: '0 0 * * 1-5'
    # ===== 下午：验证模式 =====
    - cron: '0 7 * * 1-5'
    - cron: '0 8 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: '运行模式'
        required: true
        default: 'screener'
        type: choice
        options:
          - screener
          - validation

permissions:
  contents: write

jobs:
  screener:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt

      - name: 判断模式
        id: mode
        run: |
          python -c "
          SCHEDULE = '${{ github.event.schedule }}'
          EVENT = '${{ github.event_name }}'
          MODE_INPUT = '${{ github.event.inputs.mode }}'

          MORNING = ['0 20 * * 0-4', '0 21 * * 0-4', '0 22 * * 0-4', '0 23 * * 0-4', '0 0 * * 1-5']
          AFTERNOON = ['0 7 * * 1-5', '0 8 * * 1-5']

          if EVENT == 'workflow_dispatch':
              m = MODE_INPUT or 'screener'
          elif SCHEDULE in MORNING:
              m = 'screener'
          elif SCHEDULE in AFTERNOON:
              m = 'validation'
          else:
              m = 'screener'
          print(f'mode={m}')
          " >> "$GITHUB_OUTPUT"

      # ===== 早上：等待到 9:20 CST 再运行 =====
      - name: 等待至 9:20 CST（时间门控）
        if: steps.mode.outputs.mode == 'screener'
        id: wait
        run: |
          python -c "
          from datetime import datetime, timezone, timedelta
          import time, os, json

          CST = timezone(timedelta(hours=8))
          now = datetime.now(CST)

          # 目标时间：今天 9:20 CST
          target = now.replace(hour=9, minute=20, second=0, microsecond=0)
          # 截止时间：今天 9:40 CST
          deadline = now.replace(hour=9, minute=40, second=0, microsecond=0)

          # 检查是否已完成
          today = now.strftime('%Y-%m-%d')
          already_done = False
          if os.path.exists('results.json'):
              with open('results.json') as f:
                  d = json.load(f)
              if d.get('update_time', '').startswith(today):
                  already_done = True

          if already_done:
              print('今日已完成，跳过')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('skip=true\n')
          elif now < target:
              # 还没到 9:20，等待
              wait_seconds = (target - now).total_seconds()
              print(f'当前 {now.strftime(\"%H:%M\")} CST，等待 {wait_seconds:.0f} 秒至 9:20...')
              time.sleep(min(wait_seconds, 14400))  # 最多等4小时
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('skip=false\n')
          elif now > deadline:
              # 超过 9:40，仍运行但标记超时
              print(f'当前 {now.strftime(\"%H:%M\")} CST，已超过 9:40 截止时间')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('skip=false\n')
          else:
              # 在 9:20-9:40 之间，立即运行
              print(f'当前 {now.strftime(\"%H:%M\")} CST，在目标时间窗口内，立即运行')
              with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
                  f.write('skip=false\n')
          "

      - name: 运行选股脚本
        if: steps.mode.outputs.mode == 'screener' && steps.wait.outputs.skip != 'true'
        run: |
          python generate_results.py

      - name: 提交结果
        if: steps.mode.outputs.mode == 'screener' && steps.wait.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results.json
          git diff --staged --quiet || git commit -m "auto: update screener results $(date -u '+%Y-%m-%d %H:%M')"
          git pull --rebase origin main || true
          git push

      - name: 发送选股邮件
        if: steps.mode.outputs.mode == 'screener' && steps.wait.outputs.skip != 'true'
        env:
          QQ_MAIL_ADDR: ${{ secrets.QQ_MAIL_ADDR }}
          QQ_MAIL_AUTH: ${{ secrets.QQ_MAIL_AUTH }}
        run: |
          python send_email.py

      - name: 跳过提示
        if: steps.mode.outputs.mode == 'screener' && steps.wait.outputs.skip == 'true'
        run: |
          echo "今日选股已完成，跳过本次运行"

      # ===== 下午：验证模式 =====
      - name: 验证预测结果
        if: steps.mode.outputs.mode == 'validation'
        env:
          QQ_MAIL_ADDR: ${{ secrets.QQ_MAIL_ADDR }}
          QQ_MAIL_AUTH: ${{ secrets.QQ_MAIL_AUTH }}
        run: |
          python validate_results.py
